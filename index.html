
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b2a">
<title>USF SOLAR NETWORK</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#073b2a;color:white;text-align:center;padding:25px 12px}
h1{color:#ffdf45}
main{max-width:650px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;margin-bottom:18px;border-radius:12px;box-shadow:0 3px 12px #ddd}
h2{color:#087443}
label{display:block;margin-top:12px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:7px;font-size:16px}
button{width:100%;padding:13px;margin-top:18px;background:#087443;color:white;border:0;border-radius:8px;font-size:16px}
#status{white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>☀️ USF SOLAR NETWORK</h1>
<p>Solar Contractors &amp; Dealers Network</p>
<p>सोलर प्रोजेक्ट और इंस्टॉलेशन का भरोसेमंद नेटवर्क</p>
</header>

<main>
<section class="card">
<h2>निःशुल्क रजिस्ट्रेशन</h2>
<form id="registerForm">
<label>आप कौन हैं?</label>
<select name="role" required>
<option value="contractor">सोलर कॉन्ट्रैक्टर</option>
<option value="dealer">सोलर डीलर</option>
<option value="company">सोलर कंपनी</option>
</select>

<label>पूरा नाम</label>
<input name="name" required maxlength="80" placeholder="अपना नाम">

<label>मोबाइल नंबर</label>
<input name="phone" type="tel" required
pattern="[0-9+\-\s]{10,16}" placeholder="मोबाइल नंबर">

<label>ईमेल</label>
<input name="email" type="email" required placeholder="अपना ईमेल">

<label>पासवर्ड</label>
<input name="password" type="password" required minlength="6"
autocomplete="new-password" placeholder="कम से कम 6 अक्षर">

<label>शहर</label>
<input name="city" required maxlength="80" placeholder="जैसे Vadodara">

<label>अनुभव</label>
<select name="experience" required>
<option>5 साल से अधिक</option>
<option>3 से 5 साल</option>
<option>1 से 3 साल</option>
<option>नया कॉन्ट्रैक्टर</option>
</select>

<label>काम का प्रकार</label>
<select name="work" required>
<option>पूरा सोलर इंस्टॉलेशन</option>
<option>स्ट्रक्चर और पैनल फिटिंग</option>
<option>इलेक्ट्रिकल काम</option>
<option>सभी प्रकार के सोलर काम</option>
</select>

<button id="submitBtn" type="submit">रजिस्टर करें</button>
<p id="status" role="status"></p>
</form>
</section>

<section class="card">
<h2>हमारे नेटवर्क से जुड़ें</h2>
<p>☀️ सोलर प्रोजेक्ट और इंस्टॉलेशन</p>
<p>🤝 कॉन्ट्रैक्टर और डीलर नेटवर्क</p>
<p>🏗️ स्ट्रक्चर, पैनल फिटिंग और इलेक्ट्रिकल काम</p>
</section>
</main>
<footer>© USF SOLAR NETWORK</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBeCfor87RHCdQmVWJwjG-tSIiYxAhsoLI",
  authDomain: "usf-solar-network.firebaseapp.com",
  projectId: "usf-solar-network",
  storageBucket: "usf-solar-network.firebasestorage.app",
  messagingSenderId: "1028097800606",
  appId: "1:1028097800606:web:4e18e58eab091467ab3e8f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const form = document.getElementById("registerForm");
const statusBox = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  submitBtn.disabled = true;
  statusBox.textContent = "रजिस्ट्रेशन हो रहा है, कृपया इंतज़ार करें...";

  const data = new FormData(form);
  const email = String(data.get("email")).trim();
  const password = String(data.get("password"));
  const phone = String(data.get("phone")).trim();

  try {
    const credential = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await setDoc(doc(db, "users", credential.user.uid), {
      uid: credential.user.uid,
      name: String(data.get("name")).trim(),
      email,
      phone,
      city: String(data.get("city")).trim(),
      role: String(data.get("role")),
      experience: String(data.get("experience")),
      work: String(data.get("work")),
      createdAt: serverTimestamp()
    });

    statusBox.textContent =
      "रजिस्ट्रेशन सफल हुआ! आपका अकाउंट बन गया है। ☀️";
    form.reset();
  } catch (error) {
    console.error(error);
    const messages = {
      "auth/email-already-in-use": "यह ईमेल पहले से रजिस्टर है।",
      "auth/invalid-email": "ईमेल सही दर्ज करें।",
      "auth/weak-password": "मजबूत पासवर्ड डालें (कम से कम 6 अक्षर)।",
      "auth/operation-not-allowed": "Firebase में Email/Password साइन-इन चालू करें।",
      "permission-denied": "Firestore के Security Rules जाँचने होंगे।"
    };
    statusBox.textContent =
      messages[error.code] || "रजिस्ट्रेशन नहीं हुआ। इंटरनेट और Firebase सेटिंग जाँचें।";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
